[project]
name = "rio-tourism-ai-agent"
version = "0.1.0"
description = "Assistente de turismo do Rio de Janeiro com RAG, agentes LLM e pipeline ETL"
requires-python = ">=3.10,<3.13"
dependencies = [
    # ETL Orchestration
    "dagster==1.9.10",
    "dagster-webserver==1.9.10",

    # Web Scraping
    "playwright==1.50.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "requests==2.32.3",

    # LLM Framework e Orquestração
    "langchain>=1.0",
    "langchain-core>=0.1",
    "langchain-openai>=0.1",
    "langgraph>=1.0",
    # Memoria de curto prazo do agente (checkpointer persistido em SQLite)
    "langgraph-checkpoint-sqlite>=3.1",

    # Vector Database - Armazenamento de Embeddings
    "chromadb>=1.5",
    # Pin necessario: onnxruntime>=1.24 nao tem wheel compativel com este ambiente (win_amd64/cp310)
    "onnxruntime<1.24",

    # Embeddings - Geração de Vetores
    "sentence-transformers>=5.0",

    # PDF Processing - Leitura de PDFs
    "pypdf>=6.0",

    # Environment Variables - Configuração segura
    "python-dotenv>=1.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "==8.3.4"
pytest-mock = "==3.14.0"
pytest-cov = "==6.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
